; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266 @ 4.2.1
board = d1_mini
framework = arduino
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
extra_scripts =
    pre:scripts/suppress_toolchain_warnings.py
    pre:scripts/generate_build_info.py

monitor_speed = 115200
build_flags = -Wall -Wextra
check_tool = cppcheck
check_skip_packages = yes
check_src_filters =
    +<src/>
    +<lib/>
check_flags = cppcheck: --suppress=*:*/.pio/*
lib_deps =
    ArduinoJson @ 7.4.3
    SPI
    WiFiManager @ 2.0.17
    DoubleResetDetector @ 1.0.3
    Adafruit HTU21DF Library @ 1.1.2
    Adafruit GFX Library @ 1.12.6
    Adafruit SSD1305 @ 2.2.3
    Adafruit BusIO @ 1.17.4
    Adafruit Unified Sensor @ 1.1.15
    PubSubClient @ 2.8

[env:d1_mini_debug]
extends = env:d1_mini
build_flags =
    ${env:d1_mini.build_flags}
    "-D DEBUG_ESP_PORT=Serial"

[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = wetter.local

[env:native]
platform = native
targets = test
test_framework = unity
test_build_src = yes
build_flags = -Wall -Wextra
lib_deps = ArduinoJson @ 7.4.3
build_src_filter =
    +<ConfigJsonParser.cpp>
    +<ConfigLoadStatus.cpp>
    +<DataJsonPayload.cpp>
    +<HumidityMath.cpp>
    +<IndoorSensorState.cpp>
    +<OutdoorSensorState.cpp>
    +<SensorSanity.cpp>
    +<StartupRetryPolicy.cpp>
    +<MqttPublishPolicy.cpp>
    +<TimeFormatting.cpp>
    +<Timezones.cpp>
    +<TimezoneSelectMarkupCapacity.cpp>
    +<VentingAdvice.cpp>
    +<WebNotFound.cpp>
    +<WifiConfigFields.cpp>
    +<MqttDiscovery.cpp>
